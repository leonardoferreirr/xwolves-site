<!doctype html>
<html><head><meta charset="utf-8"><style>html,body{margin:0;background:transparent}</style></head><body>
<canvas id="c"></canvas>
<script type="module">
// Desenha o lobo com o mesmo módulo do site (assets/js/lobo3d.js) para gerar a imagem de frente e conferir poses.
import { lobo } from '/assets/js/lobo3d.js';
const p = new URLSearchParams(location.search), S = +(p.get('s') || 1000);
const l = await lobo(document.getElementById('c'), p.get('glb') || '/assets/lobo/lobo-1.glb', { foto: true });
l.tamanho(S);
window.foto = (giro, incl) => { l.pose(giro + 1e-4, incl); l.pose(giro, incl); return document.getElementById('c').toDataURL('image/png'); };
window.pronto = true;
</script></body></html>
