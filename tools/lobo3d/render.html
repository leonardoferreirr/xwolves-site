<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#888}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"}}</script>
</head><body>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const P = new URLSearchParams(location.search);
const S = +(P.get('s') || 900);
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1); renderer.setSize(S, S);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.NoToneMapping;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
const pm = new THREE.PMREMGenerator(renderer);
scene.environment = pm.fromScene(new RoomEnvironment(), 0.04).texture;
const cam = new THREE.PerspectiveCamera(18, 1, 0.1, 100);

// pescoço: tudo acima de baixo→alto gira junto, com transição suave na altura do colarinho
const U = { uYaw: { value: 0 }, uPitch: { value: 0 }, uLow: { value: -0.3 }, uHigh: { value: -0.05 }, uPivot: { value: new THREE.Vector3(0, -0.2, 0) } };
const torce = `uniform float uYaw, uPitch, uLow, uHigh; uniform vec3 uPivot;
mat3 torceR(vec3 p) {
  float w = smoothstep(uLow, uHigh, p.y);
  float a = uYaw * w, b = uPitch * w;
  mat3 Ry = mat3(cos(a),0.,-sin(a), 0.,1.,0., sin(a),0.,cos(a));
  mat3 Rx = mat3(1.,0.,0., 0.,cos(b),sin(b), 0.,-sin(b),cos(b));
  return Ry * Rx;
}
`;
const patch = (m) => {
  m.onBeforeCompile = (sh) => {
    Object.assign(sh.uniforms, U);
    sh.vertexShader = sh.vertexShader.replace('void main() {', torce + 'void main() {')
      .replace('#include <beginnormal_vertex>', 'vec3 objectNormal = torceR(position) * vec3(normal);\n#ifdef USE_TANGENT\nvec3 objectTangent = torceR(position) * vec3(tangent.xyz);\n#endif')
      .replace('#include <begin_vertex>', 'vec3 transformed = torceR(position) * (vec3(position) - uPivot) + uPivot;');
  };
  m.needsUpdate = true;
};

let modelo;
window.carrega = async (url, unlit, rotY = 0) => {
  const g = await new GLTFLoader().loadAsync(url);
  modelo = g.scene;
  modelo.rotation.y = THREE.MathUtils.degToRad(rotY); modelo.updateMatrixWorld(true);
  // normaliza: altura 2, centro na origem
  const box = new THREE.Box3().setFromObject(modelo), c = box.getCenter(new THREE.Vector3()), sz = box.getSize(new THREE.Vector3());
  const k = 2 / sz.y;
  modelo.traverse((o) => {
    if (!o.isMesh) return;
    o.geometry = o.geometry.clone();
    o.geometry.applyMatrix4(o.matrixWorld);
    o.geometry.translate(-c.x, -c.y, -c.z); o.geometry.scale(k, k, k);
    o.position.set(0, 0, 0); o.rotation.set(0, 0, 0); o.scale.set(1, 1, 1); o.updateMatrix();
    if (unlit) { const t = o.material.map; o.material = new THREE.MeshBasicMaterial({ map: t }); }
    patch(o.material);
  });
  modelo.updateMatrixWorld(true);
  const flat = new THREE.Group(); modelo.traverse((o) => { if (o.isMesh) flat.add(o.clone()); });
  scene.add(flat); modelo = flat;
  const d = 1 / Math.tan(THREE.MathUtils.degToRad(cam.fov / 2)) * 1.0;
  cam.position.set(0, 0, d + sz.z * k / 2); cam.lookAt(0, 0, 0);
  if (!unlit) {
    scene.add(new THREE.HemisphereLight(0xffffff, 0x444466, 0.6));
    const key = new THREE.DirectionalLight(0xffffff, 1.4); key.position.set(-1, 1.5, 3); scene.add(key);
    const rim = new THREE.DirectionalLight(0xbcd2ff, 1.0); rim.position.set(2, 2, -3); scene.add(rim);
  }
  return { sz: sz.toArray(), k };
};
window.pose = (yawDeg, pitchDeg, cfg) => {
  if (cfg) for (const n in cfg) U[n].value = Array.isArray(cfg[n]) ? new THREE.Vector3(...cfg[n]) : cfg[n];
  U.uYaw.value = THREE.MathUtils.degToRad(yawDeg); U.uPitch.value = THREE.MathUtils.degToRad(pitchDeg);
  renderer.render(scene, cam);
  return renderer.domElement.toDataURL('image/png');
};
window.pronto = true;
</script></body></html>
